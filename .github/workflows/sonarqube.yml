name: SonarQube
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  sonarqube:
    runs-on: [ self-hosted, linux ]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan
        run: sonar-scanner -Dsonar.projectKey=softserve-python -Dsonar.projectName=softserve-python -Dsonar.sources=. -Dsonar.python.version=3
